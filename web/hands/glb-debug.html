<!doctype html>
<html>
<head><meta charset="utf-8"><title>glb debug</title><style>body{margin:0;background:#223}</style></head>
<body>
<script type="module">
import * as THREE from "three";
import { loadBoxerGlb, SkinnedBoxer } from "/src/render/graph.ts";

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color("#223344");
scene.add(new THREE.AmbientLight("#ffffff", 1.2));
const key = new THREE.DirectionalLight("#ffffff", 2.2);
key.position.set(2, 4, 3);
scene.add(key);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 50);
camera.position.set(0, 1.5, 3.4);
camera.lookAt(0, 1, 0);

const gltf = await loadBoxerGlb();
const boxer = new SkinnedBoxer(gltf, { skin: 0xb0703f, gear: 0x1d4ed8 });
scene.add(boxer.root);
boxer.actions.get("idle")?.play();
const grid = new THREE.GridHelper(4, 8);
scene.add(grid);
window.__ready = false;
const clock = new THREE.Clock();
function loop() {
  boxer.mixer.update(clock.getDelta());
  renderer.render(scene, camera);
  window.__ready = true;
  requestAnimationFrame(loop);
}
loop();
window.__setClip = (name) => {
  boxer.mixer.stopAllAction();
  const action = boxer.actions.get(name);
  if (action) { action.reset().play(); }
};
window.__inspect = () => {
  const out = [];
  boxer.root.updateMatrixWorld(true);
  boxer.root.traverse((object) => {
    if (object.isSkinnedMesh) {
      const vertex = new THREE.Vector3();
      object.applyBoneTransform(10, vertex);
      object.localToWorld(vertex);
      const bone0 = object.skeleton.bones[Math.floor(object.geometry.getAttribute("skinIndex").getX(10))];
      out.push({
        name: object.name || "mesh",
        skinnedVertex10: vertex.toArray().map((v) => Number(v.toFixed(3))),
        bone0Name: bone0?.name,
        bone0World: bone0?.getWorldPosition(new THREE.Vector3()).toArray().map((v) => Number(v.toFixed(3))),
        bindMatrix: object.bindMatrix.elements.slice(12, 15),
        bindMatrixInverse: object.bindMatrixInverse.elements.slice(12, 15),
        visible: object.visible,
        materialOpacity: Array.isArray(object.material) ? object.material.map((m) => m.opacity) : object.material.opacity,
        geometryVerts: object.geometry.getAttribute("position").count,
        groups: object.geometry.groups.length,
      });
    }
  });
  return out;
};
</script>
</body>
</html>
